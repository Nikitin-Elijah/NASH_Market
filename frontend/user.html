<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Профиль пользователя</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <button id="goHome" class="back-btn">←</button>
    <h2>Профиль</h2>
  </header>

  <main class="container">
    <div class="card user-card">
      <div class="avatar-block">
        <img id="avatar" class="avatar" src="images/default-avatar.jpg" alt="Аватар пользователя" />
        <input type="file" id="fileInput" accept="image/*" hidden />
        <button id="editPhoto" class="secondary">Изменить фото</button>
      </div>

      <h1 id="username">Имя пользователя</h1>
      <p id="email">Email</p>
      <button id="addProductBtn" class="secondary">Добавить товар</button>

      <div class="actions">
        <button id="logout" class="secondary">Выйти</button>
      </div>

      <p id="status" class="status"></p>
    </div>
  </main>

  <script src="js/user.js"></script>
</body>
</html>
