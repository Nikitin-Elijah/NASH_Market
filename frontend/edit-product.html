<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Редактировать товар</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo" onclick="window.location.href='my-products.html'">← Мои товары</div>
  </header>

  <main class="container">
    <div class="card">
      <h1>Редактирование товара</h1>

      <form id="editForm" class="form">
        <div class="form-group">
          <label for="title">Название</label>
          <input type="text" id="title" required />
        </div>

        <div class="form-group">
          <label for="description">Описание</label>
          <textarea id="description" required rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="price">Цена</label>
          <input type="number" id="price" step="0.01" required />
        </div>

        <div class="form-group">
          <label for="photo">Фото</label>
          <input type="file" id="photo" accept="image/*" />
          <div class="preview">
            <img id="previewImg" src="images/default-product.jpg" alt="Превью фото" />
          </div>
        </div>

        <button type="submit" class="primary">Сохранить изменения</button>
      </form>

      <p id="status" class="status"></p>
    </div>
  </main>

  <script src="js/edit-product.js"></script>
</body>
</html>
